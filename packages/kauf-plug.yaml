# Generic entrypoint — no defaults. Requires component_family, component_source,
# profile, and target substitutions.
#   component_family: kauf | stock
#   component_source: release | beta | local (used only by the kauf family)
#   profile:          default | lite | minimal
#   target:           plf10 | plf12

packages:
  Kauf.Profile: !include profiles/${component_family}-${profile}.yaml
  Kauf.Target:  !include targets/${component_family}-${target}-target.yaml
